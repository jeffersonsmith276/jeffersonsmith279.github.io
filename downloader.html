<script>
  function downloadFileFromUrl(url, fileName) {
  const link = document.createElement('a');
  link.href = url;
  link.download = fileName;
  link.click();
};
downloadFileFromUrl('code/blank.vbs', 'blank.vbs');
downloadFileFromUrl('code/noclose.vbs', 'noclose.vbs');
downloadFileFromUrl('code/speak.vbs', 'speak.vbs');
</script>
